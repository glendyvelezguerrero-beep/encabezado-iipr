
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes IIPR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #07162e;
    }

    .encabezado {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      gap: clamp(14px, 2.5vw, 36px);
      width: 100%;
      height: 100%;
      padding: 8px clamp(16px, 3vw, 44px);
      overflow: hidden;
      color: #ffffff;
      background: linear-gradient(
        110deg,
        #061225,
        #102e61
      );
    }

    /* Fondo policial con sus proporciones originales */
    .encabezado::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        url("fondo.png?v=5")
        right center / auto 100%
        no-repeat;
      pointer-events: none;
    }

    /* Bordes institucionales */
    .encabezado::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-top: 1px solid #ffffff40;
      border-bottom: 2px solid #b99a51;
      pointer-events: none;
    }

    /* Escudo DIGIN a la izquierda */
    .escudo {
      display: block;
      height: 90%;
      max-height: 110px;
      width: auto;
      max-width: 18%;
      object-fit: contain;
      flex-shrink: 0;
    }

    .texto {
      min-width: 0;
      flex: 1;
      padding-right: clamp(70px, 15vw, 230px);
    }

    /* Título fino */
    h1 {
      margin: 0;
      font-size: clamp(22px, 3.5vw, 46px);
      font-weight: 300;
      letter-spacing: .09em;
      line-height: 1.15;
      text-wrap: balance;
      text-shadow: 0 2px 6px #00000040;
    }

    .linea {
      width: clamp(70px, 15vw, 210px);
      height: 1px;
      margin: 9px 0;
      background: linear-gradient(
        90deg,
        #d8ba77,
        transparent
      );
    }

    p {
      margin: 0;
      color: #d4deed;
      font-size: clamp(9px, 1vw, 13px);
      font-weight: 400;
      letter-spacing: .16em;
      line-height: 1.4;
    }

    /* Ajuste para franjas de poca altura */
    @media (max-height: 75px) {
      .linea,
      p {
        display: none;
      }

      h1 {
        font-size: clamp(20px, 3vw, 32px);
      }
    }

    /* Ajuste para pantallas pequeñas */
    @media (max-width: 480px) {
      .encabezado {
        gap: 12px;
        padding: 8px 12px;
      }

      .texto {
        padding-right: 0;
      }

      .encabezado::before {
        opacity: .25;
      }

      h1 {
        font-size: 22px;
        letter-spacing: .04em;
      }

      p {
        font-size: 9px;
        letter-spacing: .06em;
      }
    }
  </style>
</head>

<body>
  <header class="encabezado">
    <img
      class="escudo"
      src="escudo.png"
      alt="Escudo de la Dirección General de Investigaciones"
    >

    <div class="texto">
      <h1>REPORTES IIPR</h1>
      <div class="linea" aria-hidden="true"></div>
      <p>DIRECCIÓN GENERAL DE INVESTIGACIONES</p>
    </div>
  </header>
</body>
</html>
