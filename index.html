<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes IIPR</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #07162e;
}

.encabezado {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.5vw, 36px);
  width: 100%;
  height: 100%;
  padding: 8px clamp(16px, 3vw, 44px);
  overflow: hidden;
  color: #fff;
  background:
    radial-gradient(ellipse at right, #164d91, transparent 65%),
    linear-gradient(110deg, #061225, #102e61);
}

/* Imagen de fondo: conserva sus proporciones */
.encabezado::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background: url("fondo.png") right center / auto 100% no-repeat;
  opacity: .3;
}

.encabezado::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    90deg, #061225 5%, #071a35bb 48%, transparent
  );
  border-top: 1px solid #ffffff40;
  border-bottom: 2px solid #b99a51;
}

/* Escudo: se adapta a la altura sin deformarse */
.escudo {
  display: block;
  height: 90%;
  max-height: 110px;
  width: auto;
  max-width: 18%;
  object-fit: contain;
  flex-shrink: 0;
}

.texto {
  min-width: 0;
}

h1 {
  margin: 0;
  font-size: clamp(22px, 3.5vw, 46px);
  font-weight: 300;
  letter-spacing: .09em;
  line-height: 1.15;
}

.linea {
  width: clamp(70px, 15vw, 210px);
  height: 1px;
  margin: 9px 0;
  background: linear-gradient(90deg, #d8ba77, transparent);
}

p {
  margin: 0;
  color: #d4deed;
  font-size: clamp(9px, 1vw, 13px);
  font-weight: 400;
  letter-spacing: .16em;
  line-height: 1.4;
}

@media (max-height: 75px) {
  .linea, p { display: none; }
  h1 { font-size: clamp(20px, 3vw, 32px); }
}

@media (max-width: 480px) {
  h1 { font-size: 22px; letter-spacing: .04em; }
  p { font-size: 9px; letter-spacing: .06em; }
}
</style>
</head>

<body>
<header class="encabezado">
  <img
    class="escudo"
    src="escudo.png"
    alt="Dirección General de Investigaciones"
  >

  <div class="texto">
    <h1>REPORTES IIPR</h1>
    <div class="linea"></div>
    <p>DIRECCIÓN GENERAL DE INVESTIGACIONES</p>
  </div>
</header>
</body>
</html>
