<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reportes IIPR</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    color: white;
    font-family: Arial, sans-serif;
    background: #06172e;
  }
  header {
    height: 100%;
    display: flex;
    align-items: center;
    gap: clamp(12px, 3vw, 36px);
    padding: 10px clamp(16px, 4vw, 56px);
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(110deg, #06172e 25%, transparent),
      repeating-linear-gradient(135deg,
        transparent 0 38px, #55cfff12 39px 40px),
      radial-gradient(ellipse at right, #125785, #06172e 75%);
    border-bottom: 3px solid #39bdec;
  }
  svg {
    width: clamp(36px, 7vw, 78px);
    height: 70%;
    max-height: 90px;
    flex-shrink: 0;
  }
  .texto { min-width: 0; }
  h1 {
    margin: 0;
    font-size: clamp(22px, 4.4vw, 56px);
    letter-spacing: .045em;
    line-height: 1.1;
    text-shadow: 0 2px 8px #0008;
  }
  p {
    margin: 8px 0 0;
    font-size: clamp(10px, 1.2vw, 14px);
    letter-spacing: .16em;
    color: #b9d9ef;
  }
  @media (max-height: 85px) {
    p { display: none; }
    h1 { font-size: clamp(20px, 4vw, 36px); }
  }
</style>
<header>
  <svg viewBox="0 0 80 96" fill="none" aria-hidden="true">
    <path d="M40 5 73 18v30c0 20-15 34-33 43C22 82 7 68 7 48V18Z"
          stroke="#dbeaf5" stroke-width="3"/>
    <path d="m21 48 13 13 26-30"
          stroke="#42c6ef" stroke-width="5"/>
  </svg>
  <div class="texto">
    <h1>REPORTES IIPR</h1>
    <p>ANÁLISIS Y SEGUIMIENTO DE REPORTES</p>
  </div>
</header>
</html>
